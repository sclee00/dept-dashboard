<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>대시보드로 보내기 설정</title>
<style>
body{font:14px/1.55 system-ui,"Malgun Gothic",sans-serif;margin:16px;max-width:860px;color:#1d2433}
h1{font-size:17px;margin:0 0 6px}p{margin:6px 0;color:#4a5466}
textarea,input{width:100%;box-sizing:border-box;font:inherit;padding:7px 8px;border:1px solid #c4cad6;border-radius:6px}
label{display:block;margin-top:10px;font-weight:600}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;padding:7px 14px;border-radius:6px;border:1px solid #c4cad6;background:#fff;cursor:pointer}
button.primary{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
#st{margin-top:10px;font-weight:600}.ok{color:#2b8a3e}.err{color:#c92a2a}
details{margin-top:12px}
h2{font-size:15px;margin:22px 0 6px;display:flex;align-items:center;gap:8px}
h2 .n{font-weight:400;color:#6b7383;font-size:13px}
.logbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.logbar input{width:auto;flex:1;min-width:160px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid #e3e6ec;vertical-align:top}
th{color:#6b7383;font-weight:600;white-space:nowrap}
td.t{white-space:nowrap;color:#4a5466;font-variant-numeric:tabular-nums}
td.s{word-break:break-all}
.res{font-weight:600;white-space:nowrap}.res.ok{color:#2b8a3e}.res.dup{color:#8a6d00}.res.fail{color:#c92a2a}.res.reply{color:#3b5bdb}
.sub{color:#6b7383;font-size:12px}
.empty{color:#6b7383;padding:10px 0}
</style></head>
<body>
<h1>학과장실 대시보드로 보내기</h1>
<p>대시보드(PC) 설정 → <b>저장·구글</b> → "휴대폰에서 쓰기"의 <b>연결 링크 복사</b>를 눌러 복사한 링크를 아래에 붙여넣으세요.</p>
<label for="link">연결 링크</label>
<textarea id="link" rows="3" placeholder="https://sclee00.github.io/dept-dashboard/#connect=…"></textarea>
<details><summary>주소와 비밀 키를 따로 넣기</summary>
<label for="url">Apps Script 웹 앱 주소</label><input id="url" placeholder="https://script.google.com/macros/s/…/exec">
<label for="key">비밀 키</label><input id="key" autocomplete="off">
</details>
<div class="row"><button class="primary" id="save" type="button">저장하고 연결 확인</button></div>
<div id="st"></div>
<p style="margin-top:16px">사용법: 메일을 고르고 도구 모음이나 메일 위의 <b>대시보드로 보내기</b> 버튼을 누르거나, 메일 목록에서 우클릭 → <b>대시보드로 보내기</b>. 여러 통을 골라 한 번에 보낼 수도 있습니다.</p>
<h2>대시보드와 주고받은 기록 <span class="n" id="logN"></span></h2>
<div class="logbar"><input id="logQ" placeholder="제목·보낸 사람으로 찾기"><select id="logF"><option value="">전체</option><option value="ok">보냄</option><option value="dup">이미 보낸 메일</option><option value="reply">답장 창 열림</option><option value="fail">실패</option></select><button id="logCsv" type="button">CSV로 저장</button><button id="logClear" type="button">기록 지우기</button></div>
<div id="log"></div>
<script src="options.js"></script>
</body></html>
