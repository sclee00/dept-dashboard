<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="업무 대시보드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237FA2FF' stroke-width='2'%3E%3Crect x='3' y='5' width='18' height='16' rx='2'/%3E%3Cpath d='M3 10h18M8 3v4M16 3v4'/%3E%3C/svg%3E">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>업무 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}

/* Look: 검은 바탕 단일 테마(벽면 모니터). Layout: 벽면 모니터용 — 큰 월 달력이 메인(날짜 칸마다 아이콘·빈 시간 배지), 오른쪽 레일에 선택한 날 / 메일 / 할 일 */
:root{
  --bg:#06080B; --surface:#0E1218; --surface-2:#151B24; --line:#242C38; --ink:#E9EDF3; --muted:#8D99AB;
  --accent:#7FA2FF; --accent-soft:#17213A; --on-accent:#06080B;
  --red:#FF8B8B; --red-soft:#3B161A; --amber:#F3BF5E; --amber-soft:#33260F; --green:#6FD4A2; --green-soft:#0E2A1F;
  --k-acad:#7FA2FF; --k-meet:#B99EF6; --k-event:#58D1CA; --k-due:#FF8B8B; --k-g:#7DB6D4; --hatch:#212935;
  --display:"Hahmlet","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}

html{font-size:calc(clamp(14px, .45vw + 8.5px, 19px) * var(--fs,1))}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;flex-direction:column;gap:1rem;padding-block:1rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem 2rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
.today{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1.15;letter-spacing:-.01em}
.term{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.25rem;color:var(--muted);font-size:.92rem}
.term b{color:var(--ink);font-weight:600}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:.5rem;align-items:stretch}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .9rem;min-width:7.5rem}
.stat .n{font-family:var(--mono);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:.78rem;color:var(--muted)}
.stat.hot .n{color:var(--red)}
.stat.warn .n{color:var(--amber)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:.35rem .7rem;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}

[hidden]{display:none!important}
.quick{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.5rem;box-shadow:0 0 0 3px var(--accent-soft)}
.qhead{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;flex:none}
.qhead b{font-family:var(--display);font-size:1.05rem}
.qhead .ic{color:var(--accent);width:1.25rem;height:1.25rem}
.qbody{display:grid;grid-template-columns:minmax(0,1fr) 25rem;gap:.6rem;align-items:start}
.qbody textarea{min-height:5.2rem;height:5.2rem;background:var(--surface-2)}
.qbody textarea.big{min-height:9rem}
.qctl{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.qctl .row{grid-column:1/-1}
.qctl .row .grow{flex:1;justify-content:center}
@media (max-width:700px){.qbody{grid-template-columns:1fr}}
.quick .status:empty{display:none}
.board{display:grid;grid-template-columns:1fr;gap:1rem}
.vtog{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vtog button{border:0;background:none;padding:.3rem .65rem;cursor:pointer;color:var(--muted);font-size:.85rem}
.vtog button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dn b{font-family:var(--body);font-size:.75rem;font-weight:700;color:var(--accent)}
.count{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.iconbtn{display:inline-flex;align-items:center;gap:.35rem}
.gchip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .75rem;cursor:pointer;font-size:.85rem;color:var(--muted);max-width:100%}
.gchip .ic{color:var(--k-g)}
.gchip.ok{color:var(--ink)}
.gchip.warn{border-color:var(--amber);color:var(--amber)}
.gchip.ask{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.gchip.ask .ic{color:var(--on-accent)}
.focusbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:.45rem}
.focusbar .fcard{padding:.5rem .65rem}
.focusbar .fcard .ft{font-size:.92rem}
.focusbar .fcard{background:var(--surface);border:1px solid var(--line)}
.focusbar .fcard.lv3{background:var(--red-soft);border-color:transparent}
.focusbar .fcard.lv2{background:var(--amber-soft);border-color:transparent}

.calwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.75rem .8rem .8rem;display:flex;flex-direction:column;gap:.55rem;min-width:0}
.calnav{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.calnav h2{font-family:var(--display);font-size:1.45rem;margin:0 .2rem;font-weight:700}
.calnav .grow{flex:1}
.legend{display:flex;gap:.25rem .75rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.25rem}
.legend .ic{width:.95rem;height:.95rem}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid .wd{font-size:.78rem;text-align:center;color:var(--muted);font-weight:600;padding-bottom:.1rem}
.mgrid .wd.sun{color:var(--red)} .mgrid .wd.sat{color:var(--accent)}
.cell{display:flex;flex-direction:column;gap:3px;min-height:6.4rem;background:var(--surface-2);border:1px solid transparent;border-radius:8px;padding:.3rem .35rem;text-align:left;cursor:pointer;min-width:0;overflow:hidden;font:inherit;color:inherit}
.cell:hover{border-color:var(--muted)}
.cell.off{background:transparent;border:1px dashed var(--line)}
.cell.out{opacity:.42}
.cell.past .citems{opacity:var(--past-o,.6)}
.cell.today{border:2px solid var(--accent);padding:calc(.3rem - 1px) calc(.35rem - 1px)}
.cell.sel{background:var(--accent-soft);border-color:var(--accent)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:.25rem;min-width:0}
.dn{font-family:var(--mono);font-weight:500;font-size:.92rem;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:.3rem}
.dn em{font-style:normal;font-family:var(--body);font-size:.68rem;font-weight:600;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 .3rem}
.cell.sun .dn{color:var(--red)} .cell.sat .dn{color:var(--accent)}
.free{font-family:var(--mono);font-size:.66rem;border-radius:5px;padding:0 .2rem;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.55}
.f-good{color:var(--muted)}
.f-mid{color:var(--muted)}
.f-low,.f-full{color:var(--red)}
.f-full{font-weight:600}
.citems{display:flex;flex-direction:column;gap:2px;min-width:0}
.ci{display:flex;align-items:center;gap:.25rem;font-size:.72rem;line-height:1.4;white-space:nowrap;overflow:hidden;border-radius:4px;padding:0 .2rem;min-width:0}
.ci .ic{width:.95rem;height:.95rem}
.ci .tm{font-family:var(--mono);color:var(--muted);font-size:.68rem;flex:none}
.ci .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ci.hot{background:var(--red-soft);color:var(--red);font-weight:600}
.ci.hot .tm{color:var(--red)}
.ci.warn{background:var(--amber-soft);color:var(--amber)}
.ci.dim{color:var(--muted)}
.ci.busy{color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 4px,var(--hatch) 4px 7px)}
.more{font-size:.7rem;color:var(--muted);padding-left:.2rem}
.kc-학사{color:var(--k-acad)} .kc-개인{color:var(--green)} .kc-회의{color:var(--k-meet)} .kc-행사{color:var(--k-event)} .kc-마감{color:var(--k-due)} .kc-g{color:var(--k-g)} .kc-할일{color:var(--muted)}
.ci.hot .ic{color:var(--red)}

.rail{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0}
.railtabs{display:flex;border-bottom:1px solid var(--line);padding:.3rem .4rem 0;gap:.2rem}
.rtab{flex:1;border:0;background:none;padding:.6rem .3rem .5rem;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:.35rem;white-space:nowrap}
.rtab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.badge{font-family:var(--mono);font-size:.72rem;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:0 .45rem;font-weight:500}
.badge.hot{background:var(--red-soft);color:var(--red)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.railbody{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.85rem;min-width:0}
.panehead{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.panehead b{font-family:var(--display);font-size:1.1rem}

.dayhead h3{font-family:var(--display);font-size:1.35rem;margin:0;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.sgrp{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.05em;margin-bottom:-.45rem}
.sched{display:flex;flex-direction:column;gap:4px}
.srow{display:grid;grid-template-columns:6.4rem 1.2rem minmax(0,1fr) auto;gap:.45rem;align-items:center;padding:.45rem .55rem;border-radius:8px;background:var(--surface-2);min-width:0;text-align:left;border:1px solid transparent;font:inherit;color:inherit;width:100%}
.srow .t{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.srow .tt{min-width:0;overflow-wrap:anywhere}
.srow .sub3{display:block;font-size:.76rem;color:var(--muted)}
.srow .acts{display:flex;gap:.2rem;align-items:center;flex-wrap:wrap}
.srow .t2{display:flex;flex-direction:column;line-height:1.25;padding-top:.1rem}.srow .t2 b{font-weight:600;color:var(--ink)}.srow .t2 span{font-size:.72rem}
.srow:not(.freeslot){align-items:start}.srow:not(.freeslot)>.icbtn,.srow:not(.freeslot)>.ic{margin-top:.15rem}
.srow .sub3{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.srow .acts .impbtn{padding:.08rem .4rem;font-size:.74rem;gap:.2rem}.srow .acts .x{padding:.12rem .25rem}
.srow:not(.freeslot){grid-template-columns:3.3rem 1.2rem minmax(0,1fr)}
.srow:not(.freeslot) .acts{grid-column:3;justify-self:start}
.srow:not(.freeslot) .acts:empty{display:none}
.srow.hot{background:var(--red-soft)} .srow.hot .tt{color:var(--red);font-weight:600}
.srow.warn{background:var(--amber-soft)}
.srow.busy{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--hatch) 6px 9px)}
.srow.busy .ic{color:var(--muted)}
.srow.freeslot{background:transparent;border:1px dashed var(--line);color:var(--muted);cursor:pointer;opacity:.75}
.srow.freeslot:hover{border-color:var(--green);color:var(--green);opacity:1}
.srow.freeslot .t{color:inherit}
.srow.freeslot:hover{border-style:solid}
.miniform{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;background:var(--surface-2);padding:.75rem;border-radius:10px;border:1px solid var(--line)}
.miniform .full{grid-column:1/-1}
.miniform label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:.2rem}
.miniform .field{background:var(--surface)}
.chk{flex-direction:row!important;align-items:center;gap:.4rem!important;color:var(--ink)!important;font-size:.88rem!important}
.chk input{accent-color:var(--accent);width:1rem;height:1rem}
.gtag{display:inline-flex;align-items:center;gap:.2rem;font-size:.72rem;color:var(--k-g)}
a.ext{color:var(--k-g);font-size:.8rem;display:inline-flex;align-items:center;gap:.2rem}

@media (min-width:1100px){
  html,body{height:100%}
  /* the PC layout always fits the window: the page itself never scrolls (each box scrolls inside) */
  html,body{overflow:hidden}
  .app{overflow:hidden}
  .app{height:100%}
  .board{grid-template-columns:minmax(0,var(--c1,2.3fr)) 1rem minmax(20rem,var(--c2,1fr));gap:0;flex:1;min-height:0}
  .gutter{display:block}
  .calwrap{min-height:0}
  .mgrid{flex:1;min-height:0;grid-template-rows:auto repeat(var(--rows,5),minmax(0,1fr))}
  .cell{min-height:0}
  .rail{min-height:0}
  .railbody{overflow:auto;flex:1;min-height:0}
}
@media (max-width:700px){
  .cell{min-height:4.2rem;padding:.2rem}
  .citems{flex-direction:row;flex-wrap:wrap;gap:1px}
  .ci{padding:0 1px;background:none!important}
  .ci .tx,.ci .tm{display:none}
  .ci.hot .ic{color:var(--red)} .ci.warn .ic{color:var(--amber)}
  .free{font-size:.6rem;padding:0 .2rem}
  .dn{font-size:.8rem}
  .dn em{display:none}
  .more{font-size:.62rem}
  .srow{grid-template-columns:3.3rem 1.1rem minmax(0,1fr)}
  .srow .acts{grid-column:3}
}

/* shared controls */
.tabs{display:flex;gap:.25rem;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;border-radius:999px;padding:.2rem .7rem;font-size:.85rem;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tab:hover{color:var(--ink)}
.field{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;min-width:0}
.field:focus{border-color:var(--accent);outline:none}
textarea.field{resize:vertical;width:100%;line-height:1.55}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.45rem .85rem;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:.2rem .6rem;font-size:.85rem}
.btn.danger{color:var(--red)}
.glw{display:inline-flex;align-items:center;vertical-align:-.14em;margin:0 .08em}
.glw svg{width:.95em;height:.95em;flex:none}
.glw .gltx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn.dangerbtn{background:var(--red);border-color:var(--red);color:#fff}
.askbox{width:min(32rem,100%)}
.askbox .btn:disabled{opacity:.35;cursor:not-allowed}
.asktbl{border-collapse:collapse;font-size:.9rem;width:100%}
.asktbl th{color:var(--muted);font-weight:500;text-align:left;padding:.25rem .8rem .25rem 0;white-space:nowrap;vertical-align:top}
.asktbl td{padding:.25rem 0}
.asktbl s{color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 10rem}
.empty{color:var(--muted);font-size:.92rem;padding:1rem;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;border-radius:999px;padding:.05rem .5rem;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.ex{border-style:dashed}
.dchip{font-family:var(--mono);font-size:.78rem;padding:.05rem .45rem;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dchip.soon{background:var(--amber-soft);color:var(--amber)}
.dchip.late{background:var(--red-soft);color:var(--red);font-weight:500}
.dchip.today{background:var(--red-soft);color:var(--red);font-weight:500}
.pill{font-size:.75rem;font-weight:600;border-radius:6px;padding:.08rem .5rem;white-space:nowrap}
.pill.reply{background:var(--amber-soft);color:var(--amber)}
.pill.replied{background:var(--green-soft);color:var(--green)}
.pill.done{background:var(--surface-2);color:var(--muted)}
.pill.pend{background:var(--accent-soft);color:var(--accent)}
.prio{width:.55rem;height:.55rem;border-radius:50%;flex:none;display:inline-block}
.prio.high{background:var(--red)} .prio.mid{background:var(--amber)} .prio.low{background:var(--line)}

/* tasks */
.addtask{display:grid;grid-template-columns:1fr auto auto auto;gap:.4rem}
@media (max-width:520px){.addtask{grid-template-columns:1fr 1fr}.addtask .field:first-child{grid-column:1/-1}}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:start;padding:.55rem .2rem;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:1.1rem;height:1.1rem;margin-top:.2rem;accent-color:var(--accent)}
.task .t{min-width:0;overflow-wrap:anywhere}
.task .meta{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.2rem;align-items:center}
.task.done .t>span:first-child{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:.1rem .3rem;border-radius:4px;opacity:.55}
.x:hover{opacity:1;color:var(--red)}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:.78rem;text-decoration:underline;text-underline-offset:2px}

/* inbox */
.paste{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:.8rem;display:flex;flex-direction:column;gap:.55rem}
.paste textarea{min-height:7.5rem;background:var(--surface)}
.status{font-size:.88rem;color:var(--muted);min-height:1.3em}
.status.err{color:var(--red)}
.mails{display:flex;flex-direction:column;gap:.5rem}
.mail{display:grid;grid-template-columns:4px 1fr;gap:.75rem;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.65rem .8rem .65rem 0;cursor:pointer;overflow:hidden}
.mail:hover{border-color:var(--muted)}
.mail .stripe{border-radius:0 3px 3px 0;background:var(--line)}
.mail.high .stripe{background:var(--red)} .mail.mid .stripe{background:var(--amber)}
.mail .sub{font-weight:600;overflow-wrap:anywhere}
.mail .from{font-size:.82rem;color:var(--muted)}
.mail .sum{font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.2rem}
.mail .pills{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.4rem;align-items:center}
.mail.archived{opacity:.6}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 14 20 / .45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(46rem,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}

#draft{min-height:16rem;font-size:.95rem}
.prompts{display:flex;flex-direction:column;gap:.6rem;margin-top:.6rem}
.pcard{border:1px solid var(--line);border-radius:var(--r);padding:.7rem .8rem;display:flex;flex-direction:column;gap:.35rem}

.sheetfoot{border-top:1px solid var(--line);padding:.8rem 1.3rem;display:flex;gap:.5rem;flex-wrap:wrap;justify-content:space-between}

/* icons, priority, focus rail */
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
.pi{display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;border-radius:6px;flex:none}
.pi .ic{width:1rem;height:1rem}
.p-high{background:var(--red-soft);color:var(--red)} .p-mid{background:var(--amber-soft);color:var(--amber)} .p-low{color:var(--muted);opacity:.7}
.colhead h2{display:flex;align-items:center;gap:.45rem}

.stat{display:grid;grid-template-columns:auto 1fr;column-gap:.6rem;align-items:center}
.stat>.ic{grid-row:1/3;width:1.5rem;height:1.5rem;color:var(--muted)}
.stat.hot>.ic{color:var(--red)} .stat.warn>.ic{color:var(--amber)}
.focus{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.55rem}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.5rem}
.fcard{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:start;text-align:left;border:0;border-radius:10px;padding:.6rem .75rem;cursor:pointer;background:var(--surface-2);min-width:0}
.fcard .fi{width:2.1rem;height:2.1rem;border-radius:8px;display:grid;place-items:center;background:var(--surface)}
.fcard .fi .ic{width:1.25rem;height:1.25rem}
.fcard .why{font-size:.75rem;font-weight:600;letter-spacing:.02em}
.fcard .ft{font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard.lv3{background:var(--red-soft)} .fcard.lv3 .fi,.fcard.lv3 .why{color:var(--red)}
.fcard.lv2{background:var(--amber-soft)} .fcard.lv2 .fi,.fcard.lv2 .why{color:var(--amber)}
.fcard.lv1 .fi,.fcard.lv1 .why{color:var(--accent)}
.fcard:hover{outline:1px solid var(--muted)}
.grp{font-size:.78rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:.35rem;margin:.3rem 0 -.2rem;letter-spacing:.04em}
.grp.hot{color:var(--red)}
.task.low .t{color:var(--muted);font-size:.93rem}
.task.high .t>span:first-child{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:.25rem}
.pill .ic{width:.95em;height:.95em}
.pill.deleg{background:var(--accent-soft);color:var(--accent)}
.mail .sub{display:flex;gap:.4rem;align-items:flex-start}
.mail.low .sub{font-weight:500;color:var(--muted)}
.ev .kic{color:var(--muted)}
.ev .kic.k-학사i{color:var(--k-acad)} .ev .kic.k-회의i{color:var(--k-meet)} .ev .kic.k-행사i{color:var(--k-event)} .ev .kic.k-마감i{color:var(--k-due)}
.ev{grid-template-columns:1.2rem 1fr auto}
.btn{display:inline-flex;align-items:center;gap:.35rem}
.timeline{list-style:none;margin:0;padding:0 0 0 .3rem;display:flex;flex-direction:column}

.timeline li::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--line);margin-top:.45rem}
.timeline li:last-child::before{background:var(--accent)}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:.25rem;top:1.1rem;bottom:0;width:1px;background:var(--line)}
.timeline .who{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.issues{margin:.4rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.3rem}
.issues li{display:flex;gap:.4rem;align-items:flex-start;color:var(--amber)}

#dlgDraft{min-height:13rem;font-size:.92rem}
.sec.delegsec{border:1px solid var(--accent-soft);background:color-mix(in srgb, var(--accent-soft) 35%, transparent);border-radius:12px;padding:.8rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:8px;z-index:30;font-size:.9rem;max-width:calc(100% - 32px)}

.dlg{position:fixed;inset:0;display:grid;place-items:center;z-index:25;padding:16px}

.dlgbox label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:.25rem}
.dlg{pointer-events:none}
.dlgbox{pointer-events:auto;max-height:100%;overflow:auto}
.dlgbox.wide{width:min(40rem,100%)}
.dlgbox h3{display:flex;align-items:center;gap:.4rem}
.bsec{display:flex;flex-direction:column;gap:.45rem;border-top:1px solid var(--line);padding-top:.7rem}

.wrule{display:flex;flex-direction:column;gap:.35rem;background:var(--surface-2);border-radius:10px;padding:.55rem .6rem}

a.btn{text-decoration:none;color:inherit}
.ptext{max-height:12rem}

/* 일정 겹침: blinking badge */
.pill.clash{background:var(--red-soft,rgb(229 72 77 / .16));color:var(--red,#e5484d);border:1px solid currentColor}
.pill.clash .ic{width:.9rem;height:.9rem}

/* ---------- tasks ---------- */

    $('taskList').innerHTML = `<li class="empty">${S.tasks.length ? '이 조건에 맞는 할 일이 없습니다.' : '할 일이 없습니다. 위에 직접 입력하거나, 메일을 분석하면 할 일이 여기로 들어옵니다.'}</li>`;

  const row = x => `
    <li class="task ${x.done ? 'done' : ''} ${esc(x.priority || 'mid')}">

  await patch('emails', id, { status: 'done' });

}

  const g = line && line.match(re); return g ? g[0] : '';

/* ---------- forgiving input: typos and loose wording (Hangul compared letter by letter) ---------- */
const H_CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', H_JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ', H_JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
function jamo(s) { let o = ''; for (const ch of String(s)) { const c = ch.charCodeAt(0) - 0xAC00; if (c >= 0 && c < 11172) o += H_CHO[Math.floor(c / 588)] + H_JUNG[Math.floor((c % 588) / 28)] + (c % 28 ? H_JONG[c % 28] : ''); else o += ch.toLowerCase(); } return o; }
function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }

// best match of a short word anywhere inside a longer title
function fuzzyIn(word, title) {
  const w = String(word).replace(/\s+/g, ''), t = String(title).replace(/\s+/g, ''); if (!w || !t) return 0;
  if (t.toLowerCase().includes(w.toLowerCase())) return 1;
  let best = hsim(w, t);
  for (let L = Math.max(1, w.length - 1); L <= w.length + 1; L++) for (let i = 0; i + L <= t.length; i++) best = Math.max(best, hsim(w, t.slice(i, i + L)));

function openSheet(id) { UI.openId = id; UI.edits = {}; UI.confirmDel = false; UI.dlgTab = null; UI.showRestEv = false; UI.showRestTk = false; UI.rawOpen = true; renderSheet(true); setTimeout(() => { const h = $('sheetTitle'); h && h.focus && h.setAttribute('tabindex','-1'); h && h.focus(); }, 0); }
function closeSheet() { if (UI.draftCtl) UI.draftCtl.abort(); UI.openId = null; UI.edits = {}; renderSheet(true); }

/* ---------- Claude prompts ---------- */
function ctxLine() { const d = new Date(); return `오늘 날짜: ${ymd(d)} (${WD[d.getDay()]}요일). 현재 학기: ${S.settings.semesterLabel}.`; }
function analysisPrompt(raw, cat, atts) {
  return `받은 메일 하나 분석 좀 해 줘.${roleLine()}
${ctxLine()}
내가 고른 분류: ${cat}
${(S.settings.ignoreHints || []).length ? '전에 내가 "상관없다"고 넘긴 메일들이야(비슷하면 irrelevant로 봐): ' + S.settings.ignoreHints.slice(0, 20).join(' / ') : ''}
${keyLine() ? keyLine() + '\n참석 여부를 묻는 메일인데 그 행사 날짜·시간이 위 중요 일정이나 출장과 겹치면, 답장은 기본으로 불참으로 써 줘(사정상 참석이 어렵다고 정중하게, 겹치는 일정의 구체 내용은 밝히지 말고). myAction에는 무엇과 겹쳐서 불참으로 썼는지 적어 줘. 겹치지 않으면 참석 여부는 [참석 / 불참]으로 비워 둬.\n' : ''}내 빈 시간 (앞으로 2주, 근무시간 안, 불가 시간이랑 기존 일정 뺀 것): ${slotsForPrompt().join(', ') || '없음'}
회의 시간 잡자거나 가능한 시간 묻는 메일이면 답장 초안에 위 목록에서 2~3개 골라 제안해 줘. 목록에 없는 시간은 된다고 쓰지 마.
메일 안에 회신·전달로 인용된 이전 메일("-----Original Message-----", "보낸 사람:", "On ... wrote:", ">" 인용, "이어진 메일" 구분선 같은 거)이 있으면 한 스레드로 봐 줘. 시간순으로 다시 정리하고, 이미 합의된 것, 누가 뭘 약속했는지, 아직 답 안 한 질문을 짚어 줘. 기준은 가장 최근 메일이야. 앞에서 이미 끝난 일은 할 일로 다시 만들지 말고, 날짜 모르는 메일은 null로 둬.
"다음 주 화요일", "이달 말" 같은 말은 그 메일 보낸 날짜 기준으로(모르면 오늘 기준) 실제 날짜(YYYY-MM-DD)로 바꿔 줘. 확정 못 하면 null. 메일에 없는 내용은 지어내지 마.
나한테 하는 말은 반말이어도 되는데, 답장 초안이랑 조교 지시 메일은 실제로 보낼 거니까 평소처럼 예의 바르게 써 줘.

답은 아래 형식 JSON 객체 하나로만 줘. 다른 말은 붙이지 말고.
{
  "subject": "메일 제목. 없으면 내용을 대표하는 짧은 제목",
  "from": "보낸 사람 이름과 소속. 모르면 빈 문자열",
  "summary": "내가 알아야 할 현재 상황의 핵심을 2~3문장으로 (스레드면 지금까지의 경과를 반영)",
  "thread": [{"date": "YYYY-MM-DD 또는 null", "from": "보낸 쪽(역할·소속)", "gist": "그 메일의 요지 한 문장"}]  (스레드가 아니면 메일 1건만, 오래된 것부터),
  "openIssues": ["아직 결정·회신되지 않은 쟁점을 짧게"],
  "priority": "high | mid | low  (마감 임박, 본부 요청, 학생 민원은 높게)",
  "needsReply": true 또는 false,
  "replyDeadline": "YYYY-MM-DD 또는 null",
  "events": [{"title": "일정 이름", "date": "YYYY-MM-DD", "time": "HH:MM 또는 null", "endTime": "HH:MM 또는 null", "location": "장소 또는 null", "kind": "회의 | 행사 | 마감 | 학사 | 개인", "important": true 또는 false, "forHead": true 또는 false}],
  "tasks": [{"title": "내가 할 일을 '~하기' 형태의 짧은 문장으로", "due": "YYYY-MM-DD 또는 null", "priority": "high | mid | low", "forHead": true 또는 false}],
  "relevance": "relevant | irrelevant",
  "ignoreReason": "irrelevant이면 그렇게 본 이유 한 문장, 아니면 null",
  "replyMode": "draft | none",
  "replyDraft": "replyMode가 draft일 때 내 이름으로 보낼 한국어 답장 전문, 아니면 null",
  "replyOptions": [],
  "delegable": true 또는 false  (자료 취합, 공문 작성, 일정 조율, 명단 정리, 회신 발송처럼 조교가 실무를 맡을 수 있는 일이 있으면 true),
  "delegateDraft": "delegable이면 내가 ${S.settings.assistant}에게 보내는 업무 지시 메일 전문(15줄 이내), 아니면 null",
  "delegateTitle": "업무 지시 메일 제목 (짧게)",
  "delegateItems": [{"text": "조교가 할 일 한 줄 (개조식, 산출물·기한 포함)", "essential": true 또는 false}],
  "myAction": "내가 지금 해야 할 일을 한두 줄로 (예: 11/3까지 예외 교과목 여부를 정해 조교에게 회신. 나머지는 조교에게 맡기면 됨)",
  "decisions": [{"question": "내가 정해야 할 것 (질문 한 줄)", "options": [{"label": "선택지 (짧게)", "detail": "고르면 어떻게 되는지 한 줄"}], "recommend": 추천 선택지 번호(0부터) 또는 null, "why": "추천 이유 한 줄 또는 null"}],
  "highlights": [{"text": "원문에서 글자 그대로 옮긴 짧은 구절", "type": "deadline | request | decision | date | attachment | warning"}]
}
forHead: 내가 직접 참석·결정·제출·확인해야 하는 일정이랑 할 일만 true. 조교·행정실·다른 부서가 실무로 하는 거나 참고용 일정은 false (화면에서 기본으로 숨겨).
myAction: 내가 뭘 언제까지 해야 하는지 한두 줄로. 할 게 없으면 "확인만 하면 됨"처럼.

  }
  if (!UI.att.length && looksLikeCommand(text) && !$('threadOf').value) {
    if (mode === 'ai') return runCommandAI(text);

    return;
  }
  if (text.length < 10 && !UI.att.length) { st.className = 'status err'; st.textContent = '메일 내용을 붙여넣어 주세요.'; return; }

  }

  try {

    } else {

    }
